<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设置访问密码 · Iris</title>
    <link rel="stylesheet" href="/auth.css">
  </head>
  <body data-auth-mode="setup">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-brand" aria-label="Iris">Iris</div>
        <div class="auth-kicker">首次使用</div>
        <h1 id="auth-title">先保护你的个人助理</h1>
        <p class="auth-copy">设置一个访问密码后，才能进入 Iris 配置台。密码只保存在这台电脑上。</p>
        <form id="auth-form" novalidate>
          <label>
            <span>设置密码</span>
            <input id="auth-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required autofocus>
          </label>
          <label>
            <span>确认密码</span>
            <input id="auth-confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
          </label>
          <p class="auth-hint">至少 8 个字符，请使用不容易猜到的密码。</p>
          <div id="auth-error" class="auth-error" role="alert" aria-live="polite"></div>
          <button id="auth-submit" type="submit">设置密码并继续</button>
        </form>
      </section>
    </main>
    <script src="/auth.js" defer></script>
  </body>
</html>
