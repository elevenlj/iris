<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris · 多机器人工作台原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#30352f;background:#f5f5f0;font-size:14px;--muted:#81867d;--line:#e3e5dc;--green:#42694c}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #98b39b;outline-offset:2px}button{color:inherit;background:none;border:0}button:disabled{opacity:.45;cursor:default}.app{display:grid;grid-template-columns:224px 302px minmax(0,1fr);height:100vh;min-height:650px}.rail{padding:30px 16px 18px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#efefe7}.brand{font:italic 36px Georgia,serif;padding:0 12px;color:#3f6046}.caption{font-size:11px;letter-spacing:2px;color:var(--muted);margin:8px 12px 35px}.section-label{font-size:12px;color:var(--muted);padding:0 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.add{font-size:22px;line-height:24px;width:28px;border-radius:6px}.add:hover{background:#dfe5da}.robot{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:14px 12px;border-radius:10px;margin-bottom:7px}.robot:hover{background:#e7e9df}.robot.selected{background:#fff;box-shadow:0 2px 6px #263d2610}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#dce6d8;color:#42634c;font-size:18px;flex:none}.robot:nth-child(2) .avatar{background:#e9e1d5;color:#8c7151}.robot:nth-child(3) .avatar{background:#e3e0ec;color:#7c6c91}.robot-name{display:block;font-weight:600}.robot-sub{display:block;font-size:11px;color:var(--muted);margin-top:5px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#75a382;margin-right:5px}.dot.off{background:#a7aba5}.rail-bottom{margin-top:auto}.global{width:100%;text-align:left;padding:14px 12px;border-top:1px solid var(--line);color:#666e61}.prototype{font-size:11px;padding:12px;color:#91958a}.sessions{background:#fafbf7;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.bot-head{padding:30px 23px 22px}.eyebrow{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin-bottom:10px}.bot-title{display:flex;align-items:center;justify-content:space-between}.bot-title h1{font-size:20px;margin:0}.settings{color:#75816e;padding:6px}.pills{display:flex;gap:6px;margin:15px 0 10px;flex-wrap:wrap}.pill{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff}.directory{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search{margin:0 18px 20px;width:calc(100% - 36px);border:1px solid var(--line);background:#f0f2eb;padding:10px 12px;border-radius:7px}.list-label{font-size:11px;color:var(--muted);padding:0 23px 12px;display:flex;justify-content:space-between}.session-list{overflow:auto;padding:0 10px;flex:1}.session{width:100%;padding:16px 13px;text-align:left;border-radius:8px;margin-bottom:5px;border:1px solid transparent}.session.active{background:#eaf0e6;border-color:#dce5d6}.session:hover{background:#edf1e8}.session-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}.time{font-size:10px;color:var(--muted);font-weight:400;white-space:nowrap}.preview{color:#81877b;font-size:12px;margin:9px 0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{font-size:10px;color:#7a8375;display:flex;justify-content:space-between}.status{color:#4b825c}.hint{padding:18px 23px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}.workspace{display:flex;flex-direction:column;min-width:0;padding:30px 30px 18px}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:9px}.workspace h2{font-size:23px;letter-spacing:-.5px;margin:0;font-weight:600}.outline{border:1px solid #d9dfd2;border-radius:7px;padding:9px 12px;background:#fff;font-size:12px;white-space:nowrap}.outline:hover{background:#edf2e9}.context{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:19px 0 20px;font-size:11px;color:#7b8575}.context .path{border-left:1px solid #d5dacd;padding-left:12px;font-family:monospace}.terminal{flex:1;min-height:250px;background:#1f2521;border-radius:11px;box-shadow:0 8px 25px #2030220b;display:flex;flex-direction:column;overflow:hidden}.terminal-bar{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0b;color:#8e9d91;font:11px monospace}.lights{letter-spacing:3px;color:#66746a}.terminal-content{padding:28px;overflow:auto;color:#c6d0c7;font:12px/1.9 Menlo,Consolas,monospace;white-space:pre-wrap;flex:1}.terminal-content .accent{color:#91bd95}.terminal-content .dim{color:#7d8d80}.terminal-footer{padding:12px 20px;background:#232c25;color:#8fa391;font:11px monospace;display:flex;justify-content:space-between}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}.toolbar button{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:#fafbf8}.toolbar button:hover{background:#e7eddf}.toolbar .spacer{flex:1}.footnote{font-size:11px;color:var(--muted);margin-top:15px;display:flex;justify-content:space-between}.empty{display:grid;place-content:center;text-align:center;height:100%;color:var(--muted);line-height:2}.empty strong{color:#4f624e;font-size:20px;font-weight:500}.empty small{font-size:12px}.empty-symbol{font-size:38px;margin-bottom:14px;color:#97aa90}dialog{width:min(490px,calc(100vw - 32px));padding:28px;border:1px solid #e0e5d9;border-radius:16px;color:#303b2e;box-shadow:0 25px 90px #17221c30}dialog::backdrop{background:#1b281d55;backdrop-filter:blur(3px)}dialog h2{font-size:21px;margin:0 0 8px}dialog p{color:var(--muted);font-size:12px;line-height:1.8}label{display:block;font-size:12px;margin-top:20px}input,select{width:100%;padding:11px;border:1px solid #dfe5d8;border-radius:7px;background:#fafbf8;margin-top:8px;color:#374333}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px}.primary{background:#466a4b;color:white;border-radius:7px;padding:10px 17px}.close{padding:10px 17px}.notice{background:#f0f3e9;padding:12px;border-radius:8px;margin-top:18px;color:#6d7e60;font-size:12px;line-height:1.8}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#334636;color:#fff;padding:13px 20px;border-radius:9px;box-shadow:0 5px 20px #0002;font-size:12px;z-index:5}.toggle-line{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}.toggle-line input{width:18px;margin:0;accent-color:#466a4b}@media(min-width:1550px){.workspace{padding:35px 45px}.terminal-content{font-size:14px}}@media(max-width:1050px){.app{grid-template-columns:180px 245px minmax(0,1fr)}.workspace{padding:25px 18px}.context .path{max-width:100%;overflow:hidden;text-overflow:ellipsis}.workspace-head{align-items:flex-start}.terminal-content{padding:18px}}@media(max-width:760px){.app{grid-template-columns:90px 205px minmax(300px,1fr);height:100dvh}.rail{padding:25px 8px}.brand{font-size:26px;padding:0}.caption,.robot-sub,.section-label span,.global span,.prototype{display:none}.robot{flex-direction:column;gap:7px;padding:12px 3px}.robot-name{font-size:10px}.section-label{justify-content:center;padding:0;margin-top:28px}.global{text-align:center}.bot-head{padding:26px 16px}.bot-title h1{font-size:17px}}
.app{grid-template-columns:302px minmax(0,1fr)}
.sidebar-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.sidebar-brand .brand{padding:0}.sidebar-brand small{font-size:10px;color:var(--muted)}
.bot-title select{margin:0;min-width:0;font-size:16px;font-weight:600;background:#fff}.bot-title{gap:8px}.bot-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11px;color:var(--muted)}.bot-actions button{padding:6px 0;color:var(--green)}.sessions>.global{padding:17px 23px}.settings{flex:none}
@media(max-width:1050px){.app{grid-template-columns:265px minmax(0,1fr)}}
@media(max-width:760px){.app{grid-template-columns:205px minmax(300px,1fr)}.sidebar-brand .brand{font-size:30px}.global span{display:inline}.sessions>.global{text-align:left}}
.session{border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 10px 22px rgba(70,45,28,.08)}
.session.session-running{border-color:#b8d3a5;background:#dfeeda}
.session.session-waiting{border-color:#d79598;background:#ead6d6}
.session.active{border-color:#b3541c;box-shadow:0 0 0 2px rgba(179,84,28,.16)}
.status-running{color:#5d8f4b}.status-waiting{color:#7f3d3d}
</style>
<div class="app">
 <aside class="sessions"><div class="bot-head"><div class="sidebar-brand"><div class="brand">iris.</div><small>交互原型</small></div><div class="eyebrow">飞书机器人</div><div class="bot-title"><select id="robot-select" aria-label="切换飞书机器人"></select><button class="settings" id="settings" aria-label="机器人设置">⚙</button></div><div class="bot-actions"><span id="bot-status"></span><button id="add">＋ 添加机器人</button></div></div><input class="search" id="search" placeholder="搜索此机器人的会话" aria-label="搜索此机器人的会话"><div class="list-label"><span>飞书会话</span><span id="count"></span></div><div class="session-list" id="sessions"></div><div class="hint">在飞书中开始对话，会话会自动出现。<br>每个会话的 Agent 均可随时切换。</div><button class="global" id="global">⚙ <span>全局设置</span></button></aside>
 <main class="workspace" id="workspace"></main>
</div>
<dialog id="editor"><form id="robot-form"><h2 id="editor-title">添加机器人</h2><p id="editor-subtitle"></p><label>机器人名称<input id="name-input" required maxlength="32" placeholder="例如：开发助手"></label><label>默认 Agent<select id="agent-input"><option>Codex</option><option>Claude Code</option><option>Aiden</option><option>Aiden X Codex</option><option>Aiden X Claude Code</option></select></label><label>默认工作目录<input id="dir-input" required placeholder="/Users/you/projects"></label><div class="notice" id="editor-notice"></div><div class="actions"><button class="close" type="button" data-close="editor">取消</button><button class="primary" id="save" type="submit">继续连接飞书</button></div></form></dialog>
<dialog id="connect"><h2>连接飞书机器人</h2><p>选择接入方式，完成后机器人将出现在工作台。</p><button class="outline" id="scan" style="width:100%;margin:15px 0">扫码创建并自动配置</button><button class="outline" id="existing" style="width:100%">接入已有机器人</button><div class="notice">原型演示：点击任一方式即可模拟连接成功。正式接入时将完成账号和企业确认、权限配置及发布状态检查。</div><div class="actions"><button class="close" data-close="connect">返回</button></div></dialog>
<dialog id="global-dialog"><h2>全局设置</h2><p>所有机器人共用的服务配置。</p><div class="toggle-line">开机自动启动 Iris<input type="checkbox" checked aria-label="开机自动启动 Iris"></div><div class="toggle-line">服务端口<span>8080</span></div><div class="toggle-line">Agent 命令列表<span>5 个已配置</span></div><div class="toggle-line">收藏目录<span>3 个目录</span></div><div class="toggle-line">消息格式与超时<span>默认配置</span></div><div class="notice">机器人凭证、开发者身份、默认 Agent 和默认目录在各机器人内独立设置。</div><div class="actions"><button class="primary" data-close="global-dialog">完成</button></div></dialog>
<script>
const bots=[
 {id:1,name:'开发助手',icon:'⌘',agent:'Codex',dir:'~/Desktop/develop/python/iris',online:true,sessions:[{id:11,name:'Iris 产品与开发',preview:'多机器人控制面板交互原型',time:'刚刚',running:true,agent:'Codex',dir:'~/Desktop/develop/python/iris'},{id:12,name:'语音服务 · 问题排查',preview:'已定位连接池未释放的问题',time:'12 分钟前',running:false,agent:'Claude Code',dir:'~/Desktop/develop/go/voip_event'},{id:13,name:'接口联调',preview:'接口测试通过，等待下一步指令',time:'1 小时前',running:false,agent:'Codex',dir:'~/Desktop/develop/go/helpdesk-intelligent'}]},
 {id:2,name:'日常助理',icon:'✳',agent:'Claude Code',dir:'~/Iris_Workspace/assistant',online:true,sessions:[{id:21,name:'产品讨论群',preview:'本周讨论已经整理成文档',time:'5 分钟前',running:false,agent:'Claude Code',dir:'~/Iris_Workspace/assistant'},{id:22,name:'我的私人助理',preview:'正在整理明天的日程',time:'刚刚',running:true,agent:'Claude Code',dir:'~/Iris_Workspace/assistant'}]},
 {id:3,name:'测试机器人',icon:'◇',agent:'Aiden X Codex',dir:'~/Iris_Workspace/test',online:false,sessions:[]}
];
let activeBot=1,activeSession=11,editing=false,pendingBot=null,toastTimer;
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bot=()=>bots.find(b=>b.id===activeBot);
function toast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=message;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),3200)}
function render(){
 $('robot-select').innerHTML=bots.map(b=>`<option value="${b.id}" ${b.id===activeBot?'selected':''}>${escapeHTML(b.name)}</option>`).join('');
 const b=bot();$('bot-status').textContent=b.online?'● 已连接飞书':'○ 已停止';
 const list=b.sessions.filter(s=>s.name.toLowerCase().includes($('search').value.toLowerCase()));$('count').textContent=list.length;
 $('sessions').innerHTML=list.map(s=>`<button class="session session-${s.running?'running':'waiting'} ${s.id===activeSession?'active':''}" data-session="${s.id}" aria-pressed="${s.id===activeSession}"><div class="session-top"><span>${escapeHTML(s.name)}</span><span class="time">${s.time}</span></div><div class="preview">${s.preview}</div><div class="session-meta"><span class="status-${s.running?'running':'waiting'}">${s.running?'running':'waiting'}</span></div></button>`).join('')||'<div class="empty"><small>'+ (b.sessions.length?'没有匹配的会话':'还没有飞书会话')+'</small></div>';
 const s=b.sessions.find(s=>s.id===activeSession);
 if(!s){$('workspace').innerHTML='';return}
 $('workspace').innerHTML=`<header class="workspace-head"><div><div class="breadcrumb">${escapeHTML(b.name)} / 飞书群会话</div><h2>${escapeHTML(s.name)}（${s.running?'running':'waiting'}）</h2></div><button class="outline" data-action="feishu">↗ 在飞书中打开</button></header><div class="context"><span class="status-${s.running?'running':'waiting'}">${s.running?'running':'waiting'}</span><span>·</span><span>${s.agent}</span><span class="path" title="${escapeHTML(s.dir)}">${escapeHTML(s.dir)}</span></div><section class="terminal" aria-label="会话终端预览"><div class="terminal-bar"><span><span class="lights">● ● ●</span> &nbsp; ${s.agent} / ${s.id===11?'iris':'workspace'}</span><span>会话终端 · 示例</span></div><div class="terminal-content"><span class="dim">${s.agent} · ${escapeHTML(s.dir)}</span>\n\n<span class="accent">›</span> ${s.id===11?'先做一个多机器人控制面板的 HTML 页面。\n  会话全部在飞书里创建，按机器人隔离。':s.preview}\n\n<span class="accent">•</span> ${s.id===11?'我会保留现有终端工作区，在左侧增加机器人导航。\n  选择机器人后，只展示该机器人的飞书会话。':'已收到消息，正在处理当前会话。'}\n\n<span class="dim">  ${s.id===11?'查看现有控制面板布局\n  确认机器人与会话的归属关系\n  生成可交互的页面原型':'读取会话上下文\n  整理相关信息'}</span>\n\n<span class="accent">${s.running?'◌ 正在处理…':'✓ 已完成，等待你的下一条消息。'}</span></div><div class="terminal-footer"><span>${s.agent}</span><span>${s.running?'运行中':'等待输入'} · 飞书已连接</span></div></section>`;
}
function openEditor(isEdit){editing=isEdit;const b=bot();$('editor-title').textContent=isEdit?'机器人设置':'添加机器人';$('editor-subtitle').textContent=isEdit?'修改默认值仅对新会话生效。':'一个机器人，一套独立的飞书会话。';$('name-input').value=isEdit?b.name:'';$('agent-input').value=isEdit?b.agent:'Codex';$('dir-input').value=isEdit?b.dir:'~/Iris_Workspace/default_dir';$('editor-notice').textContent=isEdit?'飞书应用：已绑定（示例）\n开发者：当前扫码账号。已有会话保留各自的 Agent 和目录。':'下一步连接飞书，可扫码创建新机器人，也可接入已有应用。';$('save').textContent=isEdit?'保存设置':'继续连接飞书';$('editor').showModal()}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.bot){activeBot=Number(target.dataset.bot);activeSession=bot().sessions[0]?.id;$('search').value='';render()}if(target.dataset.session){activeSession=Number(target.dataset.session);render()}if(target.dataset.close)$(target.dataset.close).close();const action=target.dataset.action;if(action==='toggle'){bot().online=true;render();toast('已模拟启动机器人')}else if(action==='notify'){target.textContent=target.textContent.includes('开启')?'通知：关闭':'通知：开启'}else if(action)toast(({feishu:'正式版本将打开此机器人对应的飞书对话',terminal:'正式版本将定位到当前会话的本地终端',agent:'会话可单独切换 Agent，不影响机器人默认设置',directory:'会话可单独切换目录，不影响其他会话',restart:'原型预览：未执行真实重启'})[action]);});
 $('add').onclick=()=>openEditor(false);$('settings').onclick=()=>openEditor(true);$('global').onclick=()=>$('global-dialog').showModal();$('search').oninput=render;
 $('robot-select').onchange=e=>{activeBot=Number(e.target.value);activeSession=bot().sessions[0]?.id;$('search').value='';render()};
 $('robot-form').onsubmit=e=>{e.preventDefault();const values={name:$('name-input').value.trim(),agent:$('agent-input').value,dir:$('dir-input').value.trim()};if(!values.name||!values.dir)return;if(editing){Object.assign(bot(),values);$('editor').close();render();toast('已更新原型设置；已有会话保持不变')}else{pendingBot=values;$('editor').close();$('connect').showModal()}};
function connect(){if(!pendingBot)return;const id=Math.max(...bots.map(b=>b.id))+1;bots.push({id,...pendingBot,icon:'✧',online:true,sessions:[]});pendingBot=null;activeBot=id;activeSession=null;$('search').value='';$('connect').close();render();toast('已模拟连接。现在可以从飞书开始第一段对话。')}
$('scan').onclick=connect;$('existing').onclick=connect;render();
</script>
</html>
