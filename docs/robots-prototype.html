<div class="app">
 <aside class="sessions"><div class="bot-head"><div class="sidebar-brand"><div class="brand">iris</div></div><div class="bot-title"><select id="robot-select" aria-label="切换飞书机器人"></select><button class="settings" id="settings" aria-label="机器人设置">⚙</button></div><div class="bot-actions"><button id="add">＋ 添加机器人</button></div></div><input class="search" id="search" placeholder="搜索会话" aria-label="搜索会话"><div class="list-label"><span>飞书会话</span><span id="count"></span></div><div class="session-list" id="sessions"></div><button class="global" id="global">⚙ <span>全局设置</span></button></aside>

</div>
<dialog id="editor"><form id="robot-form"><h2 id="editor-title">添加机器人</h2><label>机器人名称<input id="name-input" required maxlength="32" placeholder="机器人名称"></label><label>默认 Agent<select id="agent-input"><option>Codex</option><option>Claude Code</option><option>Aiden</option><option>Aiden X Codex</option><option>Aiden X Claude Code</option></select></label><label>默认工作目录<input id="dir-input" required placeholder="/Users/you/projects"></label><section id="app-info" class="app-info"><h3>飞书应用</h3><label>应用名称<input id="app-name" readonly></label><label>App ID<input id="app-id" placeholder="cli_xxx" autocomplete="off"></label><label>App Secret<input id="app-secret" type="password" placeholder="App Secret" autocomplete="off"></label><button id="show-secret" type="button" class="settings">显示 Secret</button><label>通知接收 ID<input id="receive-id" placeholder="ou_xxx / oc_xxx" autocomplete="off"></label><div class="app-tools"><button type="button" class="outline" id="test-app">测试飞书配置</button><button type="button" class="outline" id="repair-app">自动配置权限</button><button type="button" class="outline" id="app-console">打开应用后台</button></div><div id="app-result" role="status"></div></section><div class="actions"><button class="close" type="button" data-close="editor">取消</button><button class="primary" id="save" type="submit">继续连接飞书</button></div></form></dialog>
<dialog id="connect"><h2>连接飞书机器人</h2><p>选择接入方式，完成后机器人将出现在工作台。</p><button class="outline" id="scan" style="width:100%;margin:15px 0">扫码创建并自动配置</button><button class="outline" id="existing" style="width:100%">接入已有机器人</button><div class="actions"><button class="close" data-close="connect">返回</button></div></dialog>

 <h2>全局设置</h2>
 <nav class="global-tabs" aria-label="配置分组"><button type="button" data-panel="config-session" aria-pressed="false">Agent</button><button type="button" data-panel="config-workspaces" aria-pressed="false">工作目录</button><button type="button" data-panel="config-runtime" aria-pressed="false">服务</button><button type="button" data-panel="config-security" aria-pressed="false">安全</button><button type="button" data-panel="config-notify" aria-pressed="false">等待通知</button><button type="button" data-panel="config-startup" aria-pressed="false">启动预设</button></nav>
 <div id="global-fields"><section id="config-session" class="config-section config-panel" hidden>
            <h2>Agent</h2>

              <label><span>默认会话名</span><input id="cfg-lark-default-session-name"></label>
            </div>
            <div class="agent-preset">
              <div class="agent-preset-heading">

            <h2>工作目录</h2>

            <div id="workspace-option-list" class="workspace-option-list"></div>

            <h2>安全</h2>

            <div id="settings-security-warning" class="security-warning hidden" hidden>当前未设置访问密码。任何能访问本页面的人都可以修改飞书凭证和 Agent 命令，建议立即设置密码。</div>

                <button id="settings-password-save" type="button">更新密码</button>

            <div class="environment-check">

<script>
const bots=[
 {id:1,name:'开发助手',icon:'⌘',agent:'Codex',dir:'~/Desktop/develop/python/iris',online:true,sessions:[{id:11,name:'Iris 产品与开发',preview:'多机器人控制面板',time:'刚刚',running:true,agent:'Codex',dir:'~/Desktop/develop/python/iris'},{id:12,name:'语音服务 · 问题排查',preview:'已定位连接池未释放的问题',time:'12 分钟前',running:false,agent:'Claude Code',dir:'~/Desktop/develop/go/voip_event'},{id:13,name:'接口联调',preview:'接口测试通过，等待下一步指令',time:'1 小时前',running:false,agent:'Codex',dir:'~/Desktop/develop/go/helpdesk-intelligent'}]},
 {id:2,name:'日常助理',icon:'✳',agent:'Claude Code',dir:'~/Iris_Workspace/assistant',online:true,sessions:[{id:21,name:'产品讨论群',preview:'本周讨论已经整理成文档',time:'5 分钟前',running:false,agent:'Claude Code',dir:'~/Iris_Workspace/assistant'},{id:22,name:'我的私人助理',preview:'正在整理明天的日程',time:'刚刚',running:true,agent:'Claude Code',dir:'~/Iris_Workspace/assistant'}]},
 {id:3,name:'研发助手',icon:'◇',agent:'Aiden X Codex',dir:'~/Iris_Workspace/test',online:false,sessions:[]}
];
// App identity is independent of the editable Iris display name (sample data).
for(const b of bots){b.appName=b.name+'应用';b.appId='cli_demo_'+b.id;b.appSecret='demo_secret_'+b.id;b.receiveId='ou_demo_'+b.id}
let activeBot=1,activeSession=11,editing=false,pendingBot=null,toastTimer;
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bot=()=>bots.find(b=>b.id===activeBot);
function toast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=message;document.body.append(el);toastTimer=setTimeout(()=>el.remove(),3200)}
function render(){
 $('robot-select').innerHTML=bots.map(b=>`<option value="${b.id}" ${b.id===activeBot?'selected':''}>${escapeHTML(b.name)}</option>`).join('');
 const b=bot();
 const list=b.sessions.filter(s=>s.name.toLowerCase().includes($('search').value.toLowerCase()));$('count').textContent=list.length;
 $('sessions').innerHTML=list.map(s=>`<button class="session session-${s.running?'running':'waiting'} ${s.id===activeSession?'active':''}" data-session="${s.id}" aria-pressed="${s.id===activeSession}"><div class="session-top"><span>${escapeHTML(s.name)}</span><span class="time">${s.time}</span></div><div class="session-meta"><span class="status-${s.running?'running':'waiting'}">${s.running?'running':'waiting'}</span></div></button>`).join('')||'<div class="empty"><small>'+ (b.sessions.length?'没有匹配的会话':'还没有飞书会话')+'</small></div>';
 const s=b.sessions.find(s=>s.id===activeSession);
 if(!s){$('workspace').innerHTML='';return}
 $('workspace').innerHTML=`<header class="workspace-head"><div><h2>${escapeHTML(s.name)}（${s.running?'running':'waiting'}）</h2></div><button class="outline" data-action="feishu">↗ 在飞书中打开</button></header><div class="context"><span class="status-${s.running?'running':'waiting'}">${s.running?'running':'waiting'}</span><span>·</span><span>${s.agent}</span><span class="path" title="${escapeHTML(s.dir)}">${escapeHTML(s.dir)}</span></div><section class="terminal" aria-label="会话终端"><div class="terminal-content"><span class="accent">›</span> ${s.id===11?'先做一个多机器人控制面板的 HTML 页面。\n  会话全部在飞书里创建，按机器人隔离。':s.preview}\n\n<span class="accent">•</span> ${s.id===11?'我会保留现有终端工作区，在左侧增加机器人导航。\n  选择机器人后，只展示该机器人的飞书会话。':'已收到消息，正在处理当前会话。'}\n\n<span class="dim">  ${s.id===11?'查看现有控制面板布局\n  确认机器人与会话的归属关系\n  完成控制面板调整':'读取会话上下文\n  整理相关信息'}</span>\n\n<span class="accent">${s.running?'◌ 正在处理…':'✓ 已完成，等待你的下一条消息。'}</span></div></section>`;
}
function openEditor(isEdit){editing=isEdit;const b=bot();$('editor-title').textContent=isEdit?'机器人设置':'添加机器人';$('name-input').value=isEdit?b.name:'';$('app-info').hidden=!isEdit;$('app-name').value=b.appName;$('app-id').value=isEdit?b.appId:'';$('app-secret').value=isEdit?b.appSecret:'';$('app-secret').type='password';$('show-secret').textContent='显示 Secret';$('receive-id').value=isEdit?b.receiveId:'';$('app-result').textContent='';$('agent-input').value=isEdit?b.agent:'Codex';$('dir-input').value=isEdit?b.dir:'~/Iris_Workspace/default_dir';$('save').textContent=isEdit?'保存设置':'继续连接飞书';$('editor').showModal()}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.bot){activeBot=Number(target.dataset.bot);activeSession=bot().sessions[0]?.id;$('search').value='';render()}if(target.dataset.session){activeSession=Number(target.dataset.session);render()}if(target.dataset.close)$(target.dataset.close).close();const action=target.dataset.action;if(action==='toggle'){bot().online=true;render();toast('尚未连接服务，未执行启动')}else if(action==='notify'){target.textContent=target.textContent.includes('开启')?'通知：关闭':'通知：开启'}else if(action)toast(({feishu:'正式版本将打开此机器人对应的飞书对话',terminal:'正式版本将定位到当前会话的本地终端',agent:'会话可单独切换 Agent，不影响机器人默认设置',directory:'会话可单独切换目录，不影响其他会话',restart:'尚未连接服务，未执行重启'})[action]);});
 $('add').onclick=()=>openEditor(false);$('settings').onclick=()=>openEditor(true);$('global').onclick=()=>$('global-dialog').showModal();$('search').oninput=render;
 $('robot-select').onchange=e=>{activeBot=Number(e.target.value);activeSession=bot().sessions[0]?.id;$('search').value='';render()};
 $('robot-form').onsubmit=e=>{e.preventDefault();const values={name:$('name-input').value.trim(),agent:$('agent-input').value,dir:$('dir-input').value.trim()};if(!values.name||!values.dir)return;if(editing||!$('app-info').hidden){const appId=$('app-id').value.trim(),appSecret=$('app-secret').value.trim();if(!appId||!appSecret){$('app-result').textContent='请填写 App ID 和 App Secret';return}Object.assign(values,{appId,appSecret,receiveId:$('receive-id').value.trim()});if(!editing){pendingBot={...values,appName:'待同步'};$('editor').close();connect();return}if(appId!==bot().appId)values.appName='待同步';Object.assign(bot(),values);$('editor').close();render();toast('已保存页面中的配置草稿')}else{pendingBot=values;$('editor').close();$('connect').showModal()}};
function connect(){if(!pendingBot)return;const id=Math.max(...bots.map(b=>b.id))+1;bots.push({id,appName:'飞书应用 '+id,appId:'cli_demo_'+id,appSecret:'demo_secret_'+id,receiveId:'ou_demo_'+id,...pendingBot,icon:'✧',online:true,sessions:[]});pendingBot=null;activeBot=id;activeSession=null;$('search').value='';$('connect').close();render();toast('已添加到页面，尚未建立实际连接')}
// These controls edit a page-local draft only; no live settings or credentials are sent.
function globalPanel(id){document.querySelectorAll('#global-fields>.config-panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===id)))}
function addDraftRow(list,fields){const row=document.createElement('div');row.className='draft-row';row.innerHTML='<div class="row-fields">'+fields.map(([label,value])=>'<label>'+escapeHTML(label)+'<input aria-label="'+escapeHTML(label)+'" value="'+escapeHTML(value)+'"></label>').join('')+'</div><button type="button" data-remove-row>删除</button>';$(list).append(row)}
const globalAgents=[['Codex','codex --dangerously-bypass-approvals-and-sandbox --no-alt-screen'],['Claude Code','claude --dangerously-skip-permissions'],['Aiden','aiden --permission-mode bypassPermissions'],['Aiden X Codex','aiden x codex --dangerously-bypass-approvals-and-sandbox --no-alt-screen'],['Aiden X Claude Code','aiden x claude --dangerously-skip-permissions']];
for(const [name,command] of globalAgents)addDraftRow('agent-option-list',[['名称',name],['启动命令',command],['重启命令（留空使用启动命令）','']]);
addDraftRow('workspace-option-list',[['名称','Iris'],['目录','~/Desktop/develop/python/iris']]);
addDraftRow('workspace-option-list',[['名称','工作目录'],['目录','~/Desktop/develop/go']]);
addDraftRow('prestart-command-list',[['命令','source ~/.zshrc']]);
addDraftRow('custom-shortcut-list',[['名称','查看状态'],['命令','git status']]);
$('cfg-default-workspace-dir').value='~/Iris_Workspace/default_dir';
for(const [id,value] of Object.entries({'cfg-fast-waiting':450,'cfg-conservative-waiting':900,'cfg-auto-refresh-interval':6000,'cfg-headless-snapshot-timeout':15000,'cfg-lark-max-lines':120,'cfg-lark-fallback-tail-lines':80}))$(id).value=value;
$('cfg-lark-merge-wrapped-lines').checked=true;
globalPanel('config-security');
function cloneGlobalDraft(){const source=$('global-fields'),copy=source.cloneNode(true),inputs=source.querySelectorAll('input,textarea,select');copy.querySelectorAll('input,textarea,select').forEach((field,i)=>{field.value=inputs[i].type==='password'?'':inputs[i].value;if(field.type==='checkbox')field.checked=inputs[i].checked});return copy}
let savedGlobalDraft=null;
$('global').onclick=()=>{savedGlobalDraft=cloneGlobalDraft();$('global-dialog').showModal()};
function cancelGlobal(){if(savedGlobalDraft){$('global-fields').replaceWith(savedGlobalDraft);savedGlobalDraft=null}globalPanel('config-security');$('global-dialog').close()}
$('global-cancel').onclick=cancelGlobal;$('global-dialog').addEventListener('cancel',e=>{e.preventDefault();cancelGlobal()});
$('global-save').onclick=()=>{document.querySelectorAll('#global-fields input[type=password]').forEach(i=>i.value='');savedGlobalDraft=null;$('global-dialog').close();toast('已保存页面中的配置草稿')};
$('global-dialog').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.panel){globalPanel(button.dataset.panel);return}if(button.hasAttribute('data-remove-row')){button.closest('.draft-row').remove();return}
 const add={ 'agent-option-add':['agent-option-list',[['名称',''],['启动命令',''],['重启命令（留空使用启动命令）','']]],'workspace-option-add':['workspace-option-list',[['名称',''],['目录','']]],'prestart-command-add':['prestart-command-list',[['命令','']]],'custom-shortcut-add':['custom-shortcut-list',[['名称',''],['命令','']]],'drop-rule-add':['drop-rule-list',[['规则类型（line / block_head / line_group）','line'],['正则表达式',''],['块处理（drop_block / keep_head）','drop_block']]]};
 if(add[button.id]){addDraftRow(...add[button.id]);return}
 if(button.id==='environment-check-start'){$('environment-check-result').innerHTML='<div class="global-status">尚未连接服务，未执行检测</div>'+['Iris 服务','Node.js','Headless 浏览器','数据目录','飞书网络','飞书应用','Agent 启动命令','Agent 完成通知'].map(name=>'<div class="toggle-line"><span>'+name+'</span><span>待检测</span></div>').join('');return}
 if(button.id==='settings-password-save'){const password=$('settings-new-password').value,confirm=$('settings-confirm-password').value;$('settings-password-status').textContent=password.length<8?'新密码至少 8 个字符':password!==confirm?'两次密码不一致':'格式正确；尚未连接服务，未修改密码';return}
 if(button.id==='preset-save'||button.id==='start-preset-save'){const isName=button.id==='preset-save',input=$(isName?'preset-session-name':'start-preset-code');if(!input.value.trim())return;addDraftRow(isName?'preset-list':'start-preset-list',[[isName?'会话名':'标识',input.value.trim()],['命令','']]);input.value='';return}
 if(button.id==='preset-clear')$('preset-session-name').value='';if(button.id==='start-preset-clear')$('start-preset-code').value='';
 if(button.id==='startup-json-toggle'){const area=$('startup-json-preview');area.hidden=!area.hidden;if(!area.hidden){const rows=id=>Array.from($(id).querySelectorAll('.draft-row')).map(row=>Array.from(row.querySelectorAll('input')).map(i=>i.value));area.value=JSON.stringify({prestart_commands:rows('prestart-command-list'),name_presets:rows('preset-list'),start_presets:rows('start-preset-list')},null,2)}area.readOnly=true}
});
$('show-secret').onclick=()=>{const hidden=$('app-secret').type==='password';$('app-secret').type=hidden?'text':'password';$('show-secret').textContent=hidden?'隐藏 Secret':'显示 Secret'};
$('test-app').onclick=()=>{$('app-result').textContent=$('app-id').value.trim()&&$('app-secret').value.trim()?'尚未连接服务，未验证凭证':'请填写 App ID 和 App Secret'};
$('repair-app').onclick=()=>{$('app-result').textContent='尚未连接服务，未执行配置'};
$('app-console').onclick=()=>{const id=$('app-id').value.trim();if(!/^cli_[a-zA-Z0-9]+$/.test(id)||id.startsWith('cli_demo_')){$('app-result').textContent='请填写有效的 App ID';return}window.open('https://open.feishu.cn/app/'+encodeURIComponent(id),'_blank','noopener,noreferrer')};
$('scan').onclick=connect;$('existing').onclick=()=>{$('connect').close();$('app-info').hidden=false;$('app-name').value='待同步';$('save').textContent='保存并连接';$('editor').showModal()};render();
</script>
</html>
